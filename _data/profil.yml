  - title: "Ingénieure Data / BI"
    description: |
      Ingénieure Data / BI avec plus de 3 ans d’expérience dans la conception et le développement de solutions Data, couvrant l’ensemble du cycle de vie de la donnée : intégration, transformation, modélisation et restitution. Je travaille notamment avec SQL, Pentaho Data Integration, dbt et Snowflake, et possède une expérience en Business Intelligence et en conception de solutions décisionnelles. Mon parcours m’a également permis de développer une expertise en analyse fonctionnelle et en coordination technico-fonctionnelle, à l’interface entre les équipes métiers et techniques.