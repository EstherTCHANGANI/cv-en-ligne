  - title: "Ingénieure Data / BI"
    description: |
      Data Analyst / BI Engineer avec 4 ans d’expérience, j'accompagne la prise de décision en transformant des données brutes en indicateurs fiables et exploitables (SQL, dbt, Snowflake). Grâce à mon expérience en Product Definition, j'ai développé une solide capacité à cadrer les besoins métiers en amont, ce qui me permet de concevoir des modèles de données et des tableaux de bord parfaitement alignés avec les enjeux opérationnels. Curieuse et orientée impact, je recherche aujourd'hui un rôle purement analytique et décisionnel au sein d'une équipe data.