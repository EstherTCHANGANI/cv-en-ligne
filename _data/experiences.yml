subject: Expériences professionnelles
template: experiences
listing-order: 2
icon: "/assets/img/briefcase.svg"
contents:
  - title: "Product Definition Analyst"
    role: "Consultant MERITIS pour le client AMADEUS"
    context: "Optimisation des mécanismes de tarification dynamique pour répondre aux besoins et aux spécificités de plus d'une dizaine de partenaires, avec des règles métier et des exigences fonctionnelles propres à chacun."
    date: "Octobre 2025 - Aujourd’hui"
    secteur: "Aérien / Transport"
    environment: "Equipe de 10 personnes, méthodologie Agile (SAFe)"
    description:
      - title: "Analyse métier et définition des évolutions"
        details:
          - Étude des besoins métier liés aux fonctionnalités de Pricing & Shopping et compréhension des enjeux associés à la tarification dynamique aérienne.
          - Analyse du fonctionnement existant de la solution afin d'identifier les évolutions nécessaires et leurs impacts sur les fonctionnalités concernées.
          - Échanges avec le Product Owner pour clarifier les demandes, définir le périmètre fonctionnel et préciser les comportements attendus.
      - title: "Spécifications fonctionnelles"
        details:
          - Analyse des règles métier et formalisation des exigences fonctionnelles, des conditions de gestion et des cas d'utilisation.
          - Rédaction de spécifications détaillant les comportements attendus, les scénarios possibles et les cas particuliers.
          - Traduction des besoins en éléments suffisamment précis pour guider les équipes de développement dans leur réalisation.
    technologies: "Jira • Confluence • ALM Octane • SQL • Splunk • Couchbase"
  - title: "BI Engineer"
    role: "Septeo Hospitality (ex-Sequoiasoft)"
    date: "Décembre 2022 - Octobre 2025"
    secteur: "Hôtellerie / Tourisme"
    environment: "Equipe de 4 personnes"
    description:
      - title: "Analyse des besoins et conception fonctionnelle"
        details:
          - Recueil, analyse et formalisation des besoins auprès des équipes métiers et des clients afin d'identifier les données, indicateurs et restitutions attendus.
          - Traduction des besoins fonctionnels en solutions techniques adaptées aux contraintes des sources de données et des outils décisionnels.
          - Définition des règles de gestion, des indicateurs et des modalités de calcul nécessaires à la production de données cohérentes et fiables.
          - Conception et développement de flux ETL avec Pentaho Data Integration (PDI) et SQL pour extraire, transformer et charger les données issues de différentes sources.
          - Développement et évolution des traitements d'alimentation des bases de données afin de garantir la disponibilité, la cohérence et la qualité des données.
          - Refonte et développement de pipelines de transformation pour améliorer la structuration, la réutilisabilité et la maintenabilité des traitements.
          - Optimisation des requêtes SQL et des processus de transformation afin d'améliorer les performances et de fiabiliser les traitements.
      - title: "Intégration et ingénierie des données (Data Engineering)"
        details:
          - Conception, développement et maintenance de flux ETL avec Pentaho Data Integration (PDI) et SQL pour extraire, intégrer et consolider les données issues de différentes sources.
          - Développement et évolution des traitements d'alimentation des bases de données afin de garantir la disponibilité, la cohérence et la qualité des données.
          - Migration et modernisation progressive des traitements historiques vers une architecture reposant sur dbt et Snowflake.
          - Refonte et développement de pipelines de transformation pour améliorer la structuration, la réutilisabilité et la maintenabilité des traitements.
          - Optimisation des requêtes SQL et des processus de transformation afin d'améliorer les performances et de fiabiliser les traitements.
          - Maintenance corrective et évolutive des flux existants, analyse des anomalies et résolution des problèmes liés à la qualité ou à l'intégration des données.
      - title: "Modélisation et documentation du Data Warehouse"
        details:
          - Conception et évolution des modèles de données pour faciliter leur exploitation et répondre aux différents besoins d'analyse et de reporting.
          - Structuration et organisation des données afin de transformer les données brutes et opérationnelles en données consolidées et exploitables.
          - "Documentation technique et fonctionnelle du Data Warehouse : description des tables, définition des champs, explication des règles de gestion et des indicateurs."
          - Formalisation des relations entre les tables, des clés de jointure et des dépendances entre les différents objets du modèle de données.
          - Maintenance et actualisation de la documentation au fil des évolutions du modèle et des traitements, afin de faciliter la compréhension, l'exploitation et la maintenance du patrimoine de données.
      - title: "Business Intelligence et restitution des données"
        details:
          - Conception et développement de rapports et tableaux de bord interactifs pour visualiser les données et faciliter la prise de décision.
          - Mise en place d'indicateurs clés de performance (KPI) et de métriques pertinentes pour suivre l'activité et évaluer les performances.
          - Création de visualisations adaptées aux besoins des utilisateurs, avec des graphiques, des tableaux et des filtres interactifs.
          - Évolution des restitutions existantes en fonction des nouveaux besoins métiers et des évolutions fonctionnelles.
      - title: "Assistance et support aux utilisateurs"
        details:
          - Accompagnement des utilisateurs dans l'installation, la configuration et la prise en main des outils de reporting et de data visualisation.
          - Assistance technique et fonctionnelle pour faciliter l'exploitation des données et l'utilisation des solutions décisionnelles.
          - Collaboration avec les équipes techniques et métiers pour assurer le bon fonctionnement et l'évolution des solutions Data et BI.
    technologies: "SQL • PostgreSQL • Pentaho • dbt • Snowflake • GitLab • MyReport • Azure DevOps • Jira • SchemaSpy"
  - title: "Ingénieure BI — Stage"
    role: "Siemens"
    date: "Mars 2022 - Septembre 2022"
    description:
      - "Développement de solutions décisionnelles pour l’équipe Excellence Opérationnelle de Smart Infrastructure."
      - "Spécification des besoins en matière de KPI."
      - "Proposition de maquettes de visualisation."
      - "Automatisation de la collecte et de l’harmonisation de données multi-sources."
      - "Nettoyage, transformation et préparation des données."
      - "Modélisation dimensionnelle en schéma en étoile."
      - "Création et amélioration de tableaux de bord."
    environment: "Qlik Sense • SQL • Excel • Power Automate"
