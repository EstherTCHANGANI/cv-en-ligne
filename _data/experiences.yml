subject: Expériences professionnelles
template: experiences
listing-order: 2
icon: "/assets/img/briefcase.svg"
contents:
  - title: "Product Definition Analyst (Analyste Technico-fonctionnel) - CDI"
    role: "Consultant MERITIS pour le client AMADEUS"
    context: "Optimisation des mécanismes de tarification dynamique pour répondre aux besoins et aux spécificités de plus d'une dizaine de partenaires, avec des règles métier et des exigences fonctionnelles propres à chacun."
    date: "Octobre 2025 - Aujourd’hui"
    secteur: "Aérien / Transport"
    environment: "Equipe de 10 personnes, méthodologie Agile (SAFe)"
    description:
      - title: "Analyse métier et définition des évolutions"
        details:
          - Étude des besoins métier liés aux fonctionnalités de Pricing & Shopping et compréhension des enjeux associés à la tarification dynamique aérienne.
          - Analyse du fonctionnement existant de la solution afin d'identifier les évolutions nécessaires et leurs impacts sur les fonctionnalités concernées.
          - Échanges avec le Product Owner pour clarifier les demandes, définir le périmètre fonctionnel et préciser les comportements attendus.
      - title: "Spécifications fonctionnelles"
        details:
          - Analyse des règles métier et formalisation des exigences fonctionnelles, des conditions de gestion et des cas d'utilisation.
          - Rédaction de spécifications détaillant les comportements attendus, les scénarios possibles et les cas particuliers.
          - Traduction des besoins en éléments suffisamment précis pour guider les équipes de développement dans leur réalisation.
      - title: "Coordination et suivi des développements"
        details:
          - Interface entre le Product Owner et les développeurs pour garantir une compréhension commune des évolutions.
          - Accompagnement des équipes techniques dans l'interprétation des spécifications et la clarification des règles métier.
          - Suivi des évolutions et des anomalies dans Jira, analyse des dysfonctionnements et collaboration avec les développeurs pour leur résolution.
      - title: "Tests, validation et documentation"
        details:
          - Préparation et exécution de scénarios de tests fonctionnels pour vérifier la conformité des développements.
          - Réalisation des recettes, analyse des résultats et suivi des corrections.
          - Rédaction et actualisation de la documentation fonctionnelle pour assurer la traçabilité des évolutions.
    technologies: "Jira • Confluence • ALM Octane • SQL • Splunk • Couchbase"
  - title: "Analytics Engineer - CDI"
    role: "Septeo Hospitality (ex-Sequoiasoft)"
    context: "Dans le cadre du développement et de l'exploitation de la solution Resalys, dédiée à la gestion des réservations de séjours, j'étais chargée de mettre à disposition des clients des données fiables, structurées et exploitables, principalement liées à leur activité de réservation. Ces données leur permettaient d'alimenter leurs outils de reporting, de suivre leur activité et de faciliter leur prise de décision."
    date: "Décembre 2022 - Octobre 2025"
    secteur: "Hôtellerie / Tourisme"
    environment: "Equipe de 4 personnes"
    description:
      - title: "Analyse des besoins et conception fonctionnelle"
        details:
          - Recueil et analyse des besoins des clients et des équipes métiers en matière de données et de reporting.
          - Traduction des besoins en solutions techniques et définition des règles de gestion, des indicateurs et des modalités de calcul.
      - title: "Intégration et ingénierie des données (Data Engineering)"
        details:
          - Conception, développement et maintenance de flux ETL avec Pentaho Data Integration (PDI) et SQL pour extraire, intégrer et consolider les données issues de différentes sources.
          - Développement et optimisation des traitements d'alimentation et de transformation des données.
          - Migration et modernisation des traitements historiques vers dbt et Snowflake, avec refonte progressive des pipelines de données.
          - Maintenance corrective et évolutive des flux, analyse des anomalies et résolution des problèmes liés aux traitements et à la qualité des données.
      - title: "Modélisation et documentation du Data Warehouse"
        details:
          - Conception et évolution des modèles de données pour structurer les informations et faciliter leur exploitation analytique.
          - "Documentation technique et fonctionnelle du Data Warehouse : description des tables, définition des champs, règles de gestion et indicateurs."
          - Formalisation des relations entre les tables, des clés de jointure et des dépendances entre les différents objets du modèle de données.
      - title: "Business Intelligence et restitution des données"
        details:
          - Conception et développement de rapports et tableaux de bord interactifs pour visualiser les données et faciliter la prise de décision.
          - Mise en place d'indicateurs clés de performance (KPI) et de métriques pertinentes pour suivre l'activité et évaluer les performances.
          - Évolution des restitutions existantes en fonction des nouveaux besoins métiers et des évolutions fonctionnelles.
      - title: "Assistance et support aux utilisateurs"
        details:
          - Accompagnement des utilisateurs dans l'installation, la configuration et la prise en main des outils de reporting et de data visualisation.
          - Assistance technique et fonctionnelle pour faciliter l'exploitation des données et l'utilisation des solutions décisionnelles.
    technologies: "SQL • PostgreSQL • Snowflake • Pentaho • dbt • Airbyte • GitLab • MyReport • Power BI • Jira • Redmine • SchemaSpy"
  - title: "Ingénieure Business Intelligence BI — Stage"
    role: "Siemens"
    context: "Au sein de l'équipe Operational Excellence, j'ai participé à des projets de valorisation des données opérationnelles auprès de plusieurs services : dépannage, facturation, maintenance et centre d'appels.L'objectif était de centraliser et d'harmoniser des données issues de différentes sources afin de faciliter le suivi des performances et de mettre à disposition des équipes des outils de reporting adaptés à leurs besoins."
    date: "Mars 2022 - Septembre 2022"
    secteur: "Services / Smart Infrastructure"
    environment: "Equipe de 10 personnes"
    description:
      - title: "Analyse des besoins et conception fonctionnelle"
        details:
          - Recueil des besoins auprès des différents services opérationnels (dépannage, facturation, maintenance et centre d'appels) et analyse des processus existants.
          - Formalisation des besoins en spécifications fonctionnelles, définition des KPI et réalisation de maquettes de tableaux de bord.
      - title: "Collecte et préparation des données"
        details:
          - Identification et analyse des sources de données disponibles, provenant de différents services et formats.
          - Développement de traitements SQL pour extraire, nettoyer et harmoniser les données.
          - Mise en place de flux automatisés avec Power Automate pour faciliter la récupération et l'actualisation des données.
      - title: "Modélisation des données"
        details:
          - Structuration et harmonisation des données selon un schéma commun pour faciliter leur exploitation.
          - Définition des correspondances entre les différentes sources et préparation des données nécessaires au calcul des indicateurs.
      - title: "Développement des solutions BI"
        details:
          - Conception et développement de tableaux de bord sous Qlik Sense pour le suivi des performances opérationnelles.
          - Intégration des KPI et adaptation des visualisations aux besoins des différents services.
          - Ajustement des tableaux de bord en fonction des retours utilisateurs.
    technologies: "Qlik Sense • SQL • Excel • Power Automate"
