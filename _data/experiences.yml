subject: Expériences professionnelles
listing-order: 2
icon: "/assets/img/briefcase.svg"
contents:
  - title: "Product Definition Analyst"
    role: "Consultant MERITIS pour le client AMADEUS"
    date: "Octobre 2025 - Aujourd’hui"
    description:
      - "Analyse et formalisation des besoins fonctionnels pour des solutions de Pricing & Shopping dans le secteur aérien."
      - "Analyse des besoins métier et définition des évolutions fonctionnelles d’une solution de tarification dynamique aérienne."
      - "Analyse des règles métier et formalisation des spécifications fonctionnelles."
      - "Collaboration avec le Product Owner et les équipes techniques pour assurer la bonne compréhension des besoins."
      - "Suivi des évolutions et des anomalies dans un environnement Agile."
      - "Préparation des scénarios de tests, réalisation des recettes fonctionnelles et validation des évolutions."
      - "Contribution à la documentation fonctionnelle et à l’amélioration continue du produit."
    environment: "Splunk • ALM Octane • Jira • Confluence • SAFe"
  - title: "BI Engineer"
    role: "Septeo Hospitality (ex-Sequoiasoft)"
    date: "Décembre 2022 - Octobre 2025"
    description:
      - "Développement et mise à disposition de données fiables liées aux réservations de séjours pour répondre aux besoins de reporting des clients."
      - "Recueil et analyse des besoins métiers pour concevoir des solutions de reporting adaptées."
      - "Conception et développement de flux ETL en SQL avec Pentaho Data Integration."
      - "Migration et modernisation des flux de données vers dbt et Snowflake."
      - "Refonte et développement de nouveaux pipelines de transformation."
      - "Optimisation des performances et fiabilisation des traitements."
      - "Conception et automatisation de reportings."
      - "Accompagnement des utilisateurs pour l’installation et la prise en main des outils de data visualisation."
    environment: "SQL • PostgreSQL • Pentaho • dbt • Snowflake • GitLab • MyReport • Azure DevOps • Jira"
  - title: "Ingénieure BI — Stage"
    role: "Siemens"
    date: "Mars 2022 - Septembre 2022"
    description:
      - "Développement de solutions décisionnelles pour l’équipe Excellence Opérationnelle de Smart Infrastructure."
      - "Spécification des besoins en matière de KPI."
      - "Proposition de maquettes de visualisation."
      - "Automatisation de la collecte et de l’harmonisation de données multi-sources."
      - "Nettoyage, transformation et préparation des données."
      - "Modélisation dimensionnelle en schéma en étoile."
      - "Création et amélioration de tableaux de bord."
    environment: "Qlik Sense • SQL • Excel • Power Automate"
